name: Build extensions

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Every push builds, but a newer push to the same branch replaces the run in progress.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    outputs:
      slugs: ${{ steps.scan.outputs.slugs }}
    steps:
      - uses: actions/checkout@v4
      - id: scan
        run: |
          set -euo pipefail
          slugs=()
          for dir in extensions/*/; do
            [ -f "$dir/manifest.json" ] || continue
            slugs+=("$(basename "$dir")")
          done
          if [ ${#slugs[@]} -eq 0 ]; then
            echo "::error::no extension folder with a manifest.json under extensions/"
            exit 1
          fi
          echo "found: ${slugs[*]}"
          node -e 'console.log(JSON.stringify(process.argv.slice(1)))' "${slugs[@]}" > slugs.json
          echo "slugs=$(cat slugs.json)" >> "$GITHUB_OUTPUT"

  build:
    needs: discover
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        slug: ${{ fromJson(needs.discover.outputs.slugs) }}
    env:
      SLUG: ${{ matrix.slug }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Validate
        run: node tools/validate.mjs "extensions/$SLUG"

      - name: Stage package
        run: |
          set -euo pipefail
          # _metadata is written by Chrome when the unpacked folder is loaded; it must not ship.
          rm -rf dist "artifacts/$SLUG"
          mkdir -p "dist/$SLUG" artifacts
          rsync -a --exclude "_metadata/" "extensions/$SLUG/" "dist/$SLUG/"
          echo "version=$(node -p "require('./dist/$SLUG/manifest.json').version")" >> "$GITHUB_ENV"

      - name: Build store ZIP
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/artifacts/$SLUG-v$version.zip"
          (cd "dist/$SLUG" && zip -rq -X "$out" .)
          unzip -l "$out" | tail -1

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.slug }}-v${{ env.version }}
          path: artifacts/
          if-no-files-found: error

      - name: Publish release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ env.version }}
        run: |
          set -euo pipefail
          notes="$SLUG v$version, built from $GITHUB_SHA. Upload this ZIP to the Chrome Web Store from the developer dashboard."
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Same version rebuilt: replace its assets rather than cut a second tag.
            echo "release $TAG already exists, refreshing its assets"
          else
            gh release create "$TAG" --target "$GITHUB_SHA" --title "$TAG" --notes "$notes"
          fi
          ls -l artifacts
          gh release upload "$TAG" artifacts/* --clobber
          echo "### Published \`$SLUG v$version\` to release \`$TAG\`" >> "$GITHUB_STEP_SUMMARY"
